name: Update source
on:
  schedule:
    # 1st and 16th of each month at 03:17 UTC (cron cannot express "every 15 days" exactly)
    - cron: "17 3 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new IPAs
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Only track this file; skips the no-ext IPA, .deb and .dylib posts.
          # The named group `version` (Sparkle's version) becomes the release version,
          # so a new Sparkle build on the same Instagram version is still published.
          IPA_FILENAME_REGEX: '^Sparkle_v(?P<version>[^_]+)_IG_v[^_]+\.ipa$'
          # Optional Cloudflare R2 storage for faster downloads. If any of these
          # secrets is missing, the GitHub release asset URL is used instead.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_KEEP: "5"  # newest N versions live on R2; older ones fall back to GitHub
          # Caption lines matching this are left out of the changelog.
          CAPTION_DROP_REGEX: 'Support my work|Join the discussion'
        run: python fetch.py
      # always(): if a later IPA fails, still commit progress from earlier ones.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json state.json
          git diff --cached --quiet || git commit -m "Update source $(date -u +%F)"
          git push
