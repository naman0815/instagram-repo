name: Update source
on:
  schedule:
    # 1st and 16th of each month at 03:17 UTC (cron cannot express "every 15 days" exactly)
    - cron: "17 3 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch new IPAs
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Only track the main IPA. Matches both naming styles, e.g.
          #   Sparkle_v1.6.0_IG_v454.1.0.ipa  and  Sparkle v1.6.1 (IG v454.1.0).ipa
          # and skips the no-ext / "No Plugins" IPAs, .deb and .dylib posts.
          # The named group `version` (Sparkle's version) becomes the release version,
          # so a new Sparkle build on the same Instagram version is still published.
          IPA_FILENAME_REGEX: '^Sparkle[_ ]v(?P<version>[0-9][^_ ]*)[_ ]\(?IG[_ ]v[^_ )]+\)?\.ipa$'
          # Optional Cloudflare R2 storage for faster downloads. If any of these
          # secrets is missing, the GitHub release asset URL is used instead.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_KEEP: "5"  # newest N versions live on R2; older ones fall back to GitHub
          # Caption lines matching this are left out of the changelog.
          CAPTION_DROP_REGEX: 'Support my work|Join the discussion'
        run: python fetch.py
      # always(): if a later IPA fails, still commit progress from earlier ones.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json state.json
          if git diff --cached --quiet; then
            # Nothing new. GitHub disables scheduled workflows after 60 days without repo
            # activity, so if the latest commit is over 30 days old, add an empty one.
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt $(( 30 * 24 * 3600 )) ]; then
              git commit --allow-empty -m "Keep scheduled workflow alive"
            fi
          else
            git commit -m "Update source $(date -u +%F)"
          fi
          # main may have moved while this run was going (e.g. a code push): sync first.
          git pull --rebase --autostash origin main
          git push
